version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: remanso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: remanso_db
      POSTGRES_USER: remanso
      POSTGRES_PASSWORD: remanso123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remanso -d remanso_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
